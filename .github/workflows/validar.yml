name: Validar luchador

# Se ejecuta en cada Pull Request. No usa secretos y no ejecuta el código de los
# archivos recibidos: solo los lee como texto.
on:
  pull_request:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Solo tu propio archivo luchadores/tuusuario.py
        env:
          AUTOR: ${{ github.event.pull_request.user.login }}
        run: |
          autor=$(echo "$AUTOR" | tr 'A-Z' 'a-z')
          cambios=$(git diff --name-status --no-renames HEAD^1 HEAD)
          echo "$cambios"
          if [ "$(echo "$cambios" | wc -l)" -ne 1 ]; then
            echo "::error::El PR debe cambiar exactamente un archivo: luchadores/$autor.py"
            exit 1
          fi
          if [ "$cambios" != "$(printf 'A\tluchadores/%s.py' "$autor")" ] && \
             [ "$cambios" != "$(printf 'M\tluchadores/%s.py' "$autor")" ]; then
            echo "::error::El archivo debe llamarse luchadores/$autor.py (tu usuario de GitHub en minúsculas) y solo se puede añadir o editar el tuyo."
            exit 1
          fi
      - name: Validar los luchadores
        run: python3 tools/build.py --check
